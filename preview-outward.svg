      <rect x="1023" y="531" width="27" height="35" rx="13"/><path d="M1036.5 566v41a7 7 0 0 0 14 0v-39"/><path d="M1034 547h8" stroke="#aee6d1"/>
      <rect x="857" y="550" width="123" height="68" rx="29"/><path d="M859 577h119" stroke="#91aaa0"/>
    </g>
    <circle cx="918" cy="597" r="2.5" fill="#aee6d1"/>
    <g>
      <rect x="763" y="631" width="99" height="68" rx="15" fill="#0d191a" fill-opacity=".8"/>
      <rect x="872" y="631" width="99" height="68" rx="15" fill="#0d191a" fill-opacity=".8"/>
      <rect x="981" y="631" width="99" height="68" rx="15" fill="#0d191a" fill-opacity=".8"/>
      <text x="775" y="650" class="metriclabel">Левый</text><text x="884" y="650" class="metriclabel">Правый</text><text x="993" y="650" class="metriclabel">Кейс</text>
      <text x="775" y="678" class="metricvalue">86%</text><text x="884" y="678" class="metricvalue">82%</text><text x="993" y="678" class="metricvalue">64%</text>
      <rect x="775" y="687" width="75" height="4" rx="2" fill="#bad9c9" opacity=".25"/><rect x="775" y="687" width="65" height="4" rx="2" fill="#abe6d2"/>
      <rect x="884" y="687" width="75" height="4" rx="2" fill="#bad9c9" opacity=".25"/><rect x="884" y="687" width="62" height="4" rx="2" fill="#abe6d2"/>
      <rect x="993" y="687" width="75" height="4" rx="2" fill="#bad9c9" opacity=".25"/><rect x="993" y="687" width="48" height="4" rx="2" fill="#abe6d2"/>
    </g>
    <rect x="867" y="739" width="109" height="4" rx="2" fill="#f4f7ef" opacity=".78"/>
