name: Android build and checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/wrapper-validation-action@v3
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Bluetooth state logic
        run: |
          mkdir -p build/checks
          javac -d build/checks app/src/main/java/com/budscurtain/FastPairBattery.java app/src/main/java/com/budscurtain/CurtainState.java app/src/main/java/com/budscurtain/BudsDockEvidence.java checks/FastPairBatteryCheck.java checks/CurtainStateCheck.java checks/BudsDockEvidenceCheck.java
          java -cp build/checks com.budscurtain.FastPairBatteryCheck
          java -cp build/checks com.budscurtain.CurtainStateCheck
          java -cp build/checks com.budscurtain.BudsDockEvidenceCheck
      - name: Build APK and run lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
