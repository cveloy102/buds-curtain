plugins {
    id 'com.android.application'
}

android {
    namespace 'com.budscurtain'
    compileSdk {
        version = release(37) { minorApiLevel = 0 }
    }

    defaultConfig {
        applicationId 'com.budscurtain'
        minSdk 31
        targetSdk 36
        versionCode 18
        versionName '0.6.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
