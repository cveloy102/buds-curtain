<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body><div id="buds-theme-proposal">
  <style>
    #buds-theme-proposal{font-family:Inter,Roboto,"Arial",sans-serif;color:light-dark(#222a2c,#edf1ef)}
    #buds-theme-proposal *{box-sizing:border-box}
    #buds-theme-proposal .theme-controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
    #buds-theme-proposal .theme-controls span{font-size:12px;margin-right:4px}
    #buds-theme-proposal .theme-controls button{min-width:76px}
    #buds-theme-proposal .stage{display:grid;grid-template-columns:minmax(250px,290px) minmax(300px,370px);justify-content:center;align-items:center;gap:18px;padding:22px 16px 52px}
    #buds-theme-proposal .product{--panel:#f7f7f4;--row:#ffffff;--ink:#1d292e;--sub:#748188;--line:#e0e4e1;--accent:#418f73;--wall:#bdb6ad;--wall-ink:#fffaf4;--card:#f8f7f4;--card-ink:#17232d;--card-sub:#71808a;--card-line:#e2e3e0;--card-accent:#45977a;--halo:#ffffff66}
    #buds-theme-proposal .product[data-effective="dark"]{--panel:#1d2225;--row:#282e31;--ink:#f4f5f2;--sub:#a4afb1;--line:#373e41;--accent:#81d4aa;--wall:#222a31;--wall-ink:#f0f3f5;--card:#252a2e;--card-ink:#f4f5f2;--card-sub:#acb8bc;--card-line:#444b4f;--card-accent:#8bd5ad;--halo:#7c899133}
    #buds-theme-proposal .settings{width:100%;min-height:358px;background:var(--panel);color:var(--ink);border-radius:28px;padding:25px 20px 23px;box-shadow:0 14px 34px #00000020}
    #buds-theme-proposal .settings .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin:0 0 8px}
    #buds-theme-proposal .settings h2{font-size:25px;line-height:1.15;font-weight:650;letter-spacing:-.035em;margin:0 0 28px;color:var(--ink)}
    #buds-theme-proposal .settings fieldset{border:0;padding:0;margin:0;min-width:0}
    #buds-theme-proposal .settings legend{font-size:13px;font-weight:650;color:var(--sub);margin:0 0 10px}
    #buds-theme-proposal .choice{display:flex;align-items:center;gap:12px;min-height:58px;padding:11px 14px;background:var(--row);border:1px solid var(--line);color:var(--ink)}
    #buds-theme-proposal .choice:first-of-type{border-radius:15px 15px 0 0}
    #buds-theme-proposal .choice:last-of-type{border-radius:0 0 15px 15px}
    #buds-theme-proposal .choice+.choice{border-top:0}
    #buds-theme-proposal .choice:has(input:checked){background:color-mix(in srgb,var(--row) 88%,var(--accent));border-color:color-mix(in srgb,var(--accent) 58%,var(--line));position:relative;z-index:1}
    #buds-theme-proposal .choice input{accent-color:var(--accent);width:18px;height:18px;flex:none;margin:0}
    #buds-theme-proposal .choice strong{display:block;font-size:14px;font-weight:600;line-height:1.25}
    #buds-theme-proposal .choice small{display:block;font-size:11px;color:var(--sub);margin-top:3px;line-height:1.25}
    #buds-theme-proposal .settings .device{font-size:12px;color:var(--sub);margin:21px 1px 0}
    #buds-theme-proposal .phone{position:relative;width:100%;height:515px;border-radius:34px;overflow:hidden;background:var(--wall);color:var(--wall-ink);box-shadow:0 18px 36px #00000030}
    #buds-theme-proposal .phone:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 53% 22%,var(--halo),transparent 64%);pointer-events:none}
    #buds-theme-proposal .statusbar{position:absolute;top:17px;left:23px;right:23px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700}
    #buds-theme-proposal .clock{position:absolute;top:89px;left:0;right:0;text-align:center;font-size:57px;letter-spacing:-.065em;line-height:1}
    #buds-theme-proposal .date{position:absolute;top:150px;left:0;right:0;text-align:center;font-size:11px;opacity:.86}
    #buds-theme-proposal .curtain{position:absolute;bottom:21px;left:12px;right:12px;border-radius:28px;background:var(--card);color:var(--card-ink);padding:9px 19px 19px;box-shadow:0 12px 28px #00000025}
    #buds-theme-proposal .pull{width:34px;height:4px;border-radius:10px;background:var(--card-line);margin:0 auto 18px}
    #buds-theme-proposal .heading{display:flex;align-items:start;justify-content:space-between;gap:8px}
    #buds-theme-proposal .heading h3{font-size:17px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:0;color:var(--card-ink)}
    #buds-theme-proposal .heading p{font-size:11px;color:var(--card-sub);margin:6px 0 0}
    #buds-theme-proposal .status{white-space:nowrap;font-size:11px;color:var(--card-accent);padding-top:4px}
